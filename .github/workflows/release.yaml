name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Immutable image tag. A GitHub release requires vMAJOR.MINOR.PATCH; leave blank only for a non-release build.'
        required: false
      create_release:
        description: 'Create a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ inputs.tag || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate and resolve tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [[ -z "${TAG}" ]]; then
            BRANCH="${GITHUB_REF_NAME//\//-}"
            SHA="$(git rev-parse HEAD)"
            TAG="${BRANCH}-${SHA}"
          fi
          if [[ ! "${TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
            echo "::error::Tag '${TAG}' is not a valid immutable OCI tag"
            exit 1
          fi
          if [[ "${TAG}" =~ ^[Ll][Aa][Tt][Ee][Ss][Tt]$ ]]; then
            echo "::error::The moving 'latest' tag is forbidden"
            exit 1
          fi
          if [[ "${{ inputs.create_release }}" == "true" ]]; then
            if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '${TAG}' must match vMAJOR.MINOR.PATCH when creating a release (e.g. v1.2.3)"
              exit 1
            fi
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::A GitHub release must run from the merged main branch"
              exit 1
            fi
          fi
          repository="${GITHUB_REPOSITORY,,}"
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"
          echo "registry_repository=${repository}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: 'go.mod'

      - name: Install ko
        uses: ko-build/setup-ko@3aebd0597dc1e9d1a26bcfdb7cbeb19c131d3037 # v0.7

      - name: Install Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.21.4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR for Helm
        if: inputs.create_release
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Refuse existing release coordinates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
          GITHUB_REPOSITORY: ${{ steps.tag.outputs.registry_repository }}
          IMAGE_REGISTRY: ghcr.io/${{ steps.tag.outputs.registry_repository }}
          CHART_REPOSITORY: oci://ghcr.io/${{ steps.tag.outputs.registry_repository }}/helm
        run: ./hack/refuse-release-overwrite.sh

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Build and push images
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ steps.tag.outputs.registry_repository }}
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
        run: |
          set -o errexit -o nounset -o pipefail

          for component in ateapi atecontroller atelet ateom-gvisor ateom-microvm podcertcontroller atenet substrate-release-verify; do
            KO_DOCKER_REPO="${IMAGE_REPOSITORY}/${component}" \
            ./hack/run-tool.sh ko build \
              --tags "${IMAGE_TAG}" \
              --platform linux/amd64,linux/arm64 \
              --bare \
              "./cmd/${component}"
          done

      - name: Package and push Helm charts
        if: inputs.create_release
        env:
          HELM_EXPERIMENTAL_OCI: "1"
          CHART_REPOSITORY: oci://ghcr.io/${{ steps.tag.outputs.registry_repository }}/helm
        run: |
          set -o errexit -o nounset -o pipefail

          tag="${{ steps.tag.outputs.value }}"
          chart_version="${tag#v}"
          package_dir="${RUNNER_TEMP}/helm-packages"
          mkdir -p "${package_dir}"

          helm package charts/substrate-crds \
            --destination "${package_dir}" \
            --version "${chart_version}" \
            --app-version "${tag}"
          helm package charts/substrate \
            --destination "${package_dir}" \
            --version "${chart_version}" \
            --app-version "${tag}"

          helm push "${package_dir}/substrate-crds-${chart_version}.tgz" "${CHART_REPOSITORY}"
          helm push "${package_dir}/substrate-${chart_version}.tgz" "${CHART_REPOSITORY}"

      - name: Build kubectl-ate release binaries
        if: inputs.create_release
        env:
          VERSION: ${{ steps.tag.outputs.value }}
        run: |
          set -o errexit -o nounset -o pipefail

          mkdir -p dist
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
                -trimpath \
                -ldflags="-s -w -X=github.com/agent-substrate/substrate/internal/version.Version=${VERSION}" \
                -o "dist/kubectl-ate-${os}-${arch}" \
                ./cmd/kubectl-ate
            done
          done

      - name: Create GitHub Release
        if: inputs.create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: dist/kubectl-ate-*
