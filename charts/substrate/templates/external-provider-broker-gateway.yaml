{{- if .Values.externalProviderBroker.gateway.enabled }}
{{- $gateway := .Values.externalProviderBroker.gateway }}
{{- $name := include "substrate.fullname" (list "external-provider-broker" .) }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: external-provider-broker
    app.kubernetes.io/part-of: substrate
{{- with $gateway.annotations }}
  annotations:
{{ toYaml . | indent 4 }}
{{- end }}
spec:
  gatewayClassName: {{ $gateway.gatewayClassName }}
{{- with $gateway.addresses }}
  addresses:
{{ toYaml . | indent 2 }}
{{- end }}
{{- with $gateway.infrastructure.parametersRef }}
  infrastructure:
    parametersRef:
      group: {{ .group | quote }}
      kind: {{ .kind | quote }}
      name: {{ .name | quote }}
{{- end }}
  listeners:
  - name: broker
    hostname: {{ $gateway.hostname | quote }}
    port: {{ $gateway.listenerPort }}
    protocol: TLS
    tls:
      mode: Passthrough
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - group: gateway.networking.k8s.io
        kind: TLSRoute
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: external-provider-broker
    app.kubernetes.io/part-of: substrate
spec:
  hostnames:
  - {{ $gateway.hostname | quote }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ $name }}
    sectionName: broker
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: {{ include "substrate.fullname" (list "api" .) }}
      port: {{ .Values.externalProviderBroker.containerPort }}
      weight: 1
{{- end }}
