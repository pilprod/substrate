{{- if eq (.Values.profile | default "standard") "external-control-plane-only" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: ate-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
rules:
- apiGroups: ["ate.dev"]
  resources: ["actortemplates"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["ate.dev"]
  resources: ["actortemplates/status"]
  verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
subjects:
- kind: ServiceAccount
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: ate-controller
spec:
  selector:
    app: ate-controller
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "substrate.fullname" (list "ate-controller" .) }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ate-controller
  template:
    metadata:
      labels:
        app: ate-controller
    spec:
      serviceAccountName: {{ include "substrate.fullname" (list "ate-controller" .) }}
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ate-controller
        image: {{ include "substrate.componentImage" (list "atecontroller" .) }}
        args:
        - "--controller-mode=external-templates-only"
        - "--ateapi-conn-spec=dns:///{{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc:443"
        - "--ateapi-ca-file=/run/secrets/substrate/tls/ate-controller/server-ca.pem"
        - "--ateapi-server-name={{ include "substrate.fullname" (list "api" .) }}.{{ .Release.Namespace }}.svc"
        - "--ateapi-client-cert=/run/secrets/substrate/tls/ate-controller/client-credential-bundle.pem"
{{- if .Values.otel.endpoint }}
        env:
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ .Values.otel.endpoint | quote }}
{{- end }}
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: healthz
          containerPort: 8081
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - { name: ate-controller-tls, mountPath: /run/secrets/substrate/tls/ate-controller, readOnly: true }
      volumes:
      - name: ate-controller-tls
        secret:
          secretName: {{ .Values.externalControlPlane.tls.controller.existingSecret.name }}
          defaultMode: 0400
          items:
          - key: {{ .Values.externalControlPlane.tls.controller.existingSecret.credentialBundleKey }}
            path: client-credential-bundle.pem
          - key: {{ .Values.externalControlPlane.tls.controller.existingSecret.serverCAKey }}
            path: server-ca.pem
{{- end }}
