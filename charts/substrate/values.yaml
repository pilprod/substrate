# Default values for the substrate chart.
#
# The standard profile requires ClusterTrustBundle,
# ClusterTrustBundleProjection, PodCertificateRequest, and the
# certificates.k8s.io/v1beta1 API. The external-control-plane-only profile
# uses existing Kubernetes Secrets instead, for compatibility with GKE.

# Set to true to have the chart create the release namespace.
# Off by default — most helm workflows expect the namespace to already exist
# (helm install -n <ns> --create-namespace). Enable for the generated
# manifests/ate-install/ install path (kubectl apply).
createNamespace: false

# Installation topology. "standard" preserves the historical full control and
# data plane. "external-control-plane-only" keeps ate-api-server and its
# dedicated ExternalProviderBroker listener while omitting every in-cluster
# worker, network data plane, storage backend, and beta Pod Certificate API.
profile: standard

postgres:
  storageSize: 1Gi
  connectionString: ""
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

rustfs:
  enabled: true
  storageSize: 1Gi
  bucket: ate-snapshots
  accessKey: rustfsadmin
  secretKey: rustfsadmin

# atelet daemonset overrides. Defaults use the in-cluster RustFS deployment for
# snapshots. Set rustfs.enabled=false and override these fields when using
# external storage.
# extraArgs / extraEnv are appended verbatim for installer-specific knobs
# (e.g. registry replacement for kind).
atelet:
  gcpAuthForImagePulls: false
  storageBackend: s3
  extraArgs: []
  extraEnv: []

# Name of a ConfigMap in the release namespace that supplies per-environment
# overrides for ate-api-server (ATE_API_POSTGRES_CONNECTION_STRING, ...).
# Mounted via envFrom with optional=true. Created by the chart from these values.
ateApiServerEnvVarsConfigMap: ate-api-server-envvars

# Dedicated, server-authenticated TLS endpoint for external provider
# enrollment/session credentials. It is an additional port on the internal API
# Service and is disabled unless explicitly enabled. Enabling it pins
# ate-api-server to one Recreate-strategy replica until route ownership is
# distributed. A separate ingress or tunnel is required for clients outside
# the cluster.
externalProviderBroker:
  enabled: false
  containerPort: 8443
  sessionTokenTTL: 5m

# Required only by profile=external-control-plane-only. The chart references a
# pre-created Secret and never accepts or creates its value. The selected key is
# mounted as a file rather than copied into a ConfigMap or environment variable.
externalControlPlane:
  postgres:
    existingSecret:
      name: ""
      key: connection-string
  # The external profile does not use PodCertificate or ClusterTrustBundle
  # projections. These pre-created Secrets must contain PEM material in the
  # exact formats documented in README.md; the chart never creates them.
  tls:
    apiServer:
      existingSecret:
        name: ""
        credentialBundleKey: server-credential-bundle.pem
        clientCAKey: client-ca.pem
    controller:
      existingSecret:
        name: ""
        credentialBundleKey: client-credential-bundle.pem
        serverCAKey: server-ca.pem
  networkPolicy:
    # The profile selects only ate-api-server and denies all ingress and egress
    # by default. The allow lists below are explicit NetworkPolicy peers/rules.
    enabled: true
    allowDNS: true
    dnsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    dnsPodSelector:
      matchLabels:
        k8s-app: kube-dns
    # Arrays of NetworkPolicyPeer objects. Ports are fixed by the chart to the
    # Control API (443) and Broker (externalProviderBroker.containerPort).
    apiIngress: []
    brokerIngress: []
    # Peers allowed to scrape the external-template-only controller on 8080.
    controllerIngress: []
    # Array of complete NetworkPolicyEgressRule objects. At minimum, allow the
    # Kubernetes API and the externally managed PostgreSQL endpoint.
    egress: []
    # Complete NetworkPolicyEgressRule objects for the controller. It needs the
    # Kubernetes API and ate-api-server, but never PostgreSQL or provider ingress.
    controllerEgress: []

otel:
  endpoint: ""

image:
  registry: ghcr.io/kagent-dev/substrate
  tag: ""

images:
  postgres: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
  rustfs: rustfs/rustfs:1.0.0-beta.3@sha256:378642b05b7dcb4849fb77ebe6aca4ced1c3f66e7e504247df95a5c9018d3358
  awsCli: amazon/aws-cli:2.17.0@sha256:643507c10ada7964ca6157b3d799f030b90577643da9955d319a77399ed80d73
  agentgateway: ghcr.io/kagent-dev/substrate/agentgateway:dfd154e6a731
  coredns: coredns/coredns:1.11.1
  busybox: busybox:1.36
