profile: external-control-plane-only

externalControlPlane:
  postgres:
    # This Secret is created and rotated outside this chart. Its
    # "connection-string" key contains the complete PostgreSQL URI for the
    # externally managed Cloud SQL endpoint or its separately managed proxy.
    existingSecret:
      name: substrate-cloud-sql
      key: connection-string
  networkPolicy:
    enabled: true
    allowDNS: true
    apiIngress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kagent-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: kagent-controller
    - podSelector:
        matchLabels:
          app: ate-controller
    brokerIngress:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: client-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: client-gateway
    egress:
    # Replace these documentation-only addresses with the exact private GKE
    # API endpoint and private Cloud SQL endpoint assigned to the environment.
    - to:
      - ipBlock:
          cidr: 192.0.2.10/32
      ports:
      - protocol: TCP
        port: 443
    - to:
      - ipBlock:
          cidr: 192.0.2.20/32
      ports:
      - protocol: TCP
        port: 5432
    controllerEgress:
    - to:
      - podSelector:
          matchLabels:
            app: ate-api-server
      ports:
      - protocol: TCP
        port: 443
    - to:
      - ipBlock:
          cidr: 192.0.2.10/32
      ports:
      - protocol: TCP
        port: 443

# The profile enables this listener even though the historical chart default
# remains false. The port and token TTL stay configurable.
externalProviderBroker:
  containerPort: 8443
  sessionTokenTTL: 5m
